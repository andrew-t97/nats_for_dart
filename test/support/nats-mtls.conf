# NATS server config for mutual TLS (mTLS) integration tests.
#
# Paths are resolved inside the container — `test/support/certs/` is mounted
# read-only at `/certs` by `DockerNatsMtls`.
#
# Cert regeneration instructions live in `nats-tls.conf` — they apply here
# too since both fixtures share `test/support/certs/`.

port: 4224
monitor_port: 8224

tls {
  cert_file: "/certs/server-cert.pem"
  key_file:  "/certs/server-key.pem"
  ca_file:   "/certs/ca-cert.pem"
  verify:    true
}
