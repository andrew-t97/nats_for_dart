# NATS server config for TLS handshake-first integration tests.
#
# Paths are resolved inside the container — `test/support/certs/` is mounted
# read-only at `/certs` by `DockerNatsTlsHandshakeFirst`.
#
# Port 4225 is intentional — runs alongside the standard TLS fixture on 4223
# and the mTLS fixture on 4224 without clashing.
#
# Cert regeneration instructions live in `nats-tls.conf` — they apply here
# too since all TLS fixtures share `test/support/certs/`.

port: 4225
monitor_port: 8225

tls {
  cert_file:        "/certs/server-cert.pem"
  key_file:         "/certs/server-key.pem"
  handshake_first:  true
}
